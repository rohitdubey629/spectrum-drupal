$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Carousel
group: Organisms
status: stable
description: Full-bleed fading slideshow with a centred title, as the Industries carousel on spectrumtech.com — autoplay every 10s, play/pause button and slide dots (bottom right). Each slide is a Carousel slide molecule.
props:
  type: object
  properties:
    heading:
      type: string
      title: Heading
      examples: ['Industries']
    subheading:
      type: string
      title: Subheading
      examples: ['Our Area of Expertise']
    label:
      type: string
      title: Accessible name
      description: Name of the carousel for screen readers, defaults to the heading.
    interval:
      type: integer
      title: Autoplay interval (ms)
      description: Time per slide, defaults to 10000 (as on the live site). 0 = no autoplay.
      default: 10000
    slides:
      type: array
      title: Slides
      description: Each item has the Carousel slide props — heading, text, image_url, image_alt, cta_text, cta_url.
      items:
        type: object
        properties:
          heading:
            type: string
          text:
            type: string
          image_url:
            type: string
          image_alt:
            type: string
          cta_text:
            type: string
          cta_url:
            type: string
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
