$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Intro
group: Organisms
status: stable
description: Centred intro section — heading, rich text and an optional CTA button — as the "Mark of Excellence" section on spectrumtech.com. Reusable for any heading + copy + CTA section.
props:
  type: object
  required: [heading]
  properties:
    heading:
      type: string
      title: Heading
      examples: ['The Mark of Excellence™']
    heading_tag:
      type: string
      title: Heading tag
      description: Semantic level, defaults to h2.
      enum: [h2, h3, h4]
      default: h2
    cta_text:
      type: string
      title: CTA text
      examples: ['Request a Consultation']
    cta_url:
      type: string
      title: CTA URL
      examples: ['/contact-us']
    background:
      type: string
      title: Section background
      enum: [grey, white]
      default: grey
slots:
  body:
    title: Body
    description: Rich text (Drupal — the formatted body field), max 750px wide.
