$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Mega menu column
group: Molecules
status: stable
description: One column of a mega menu panel. An optional heading (menu level 2) and a list of links (menu level 3).
props:
  type: object
  properties:
    heading:
      type: string
      title: Heading
      description: Empty = no heading (used for 2-level menus such as Industries).
      examples: ['Laser Wire Markers']
    heading_url:
      type: string
      title: Heading URL
      description: Empty = heading is plain text.
      examples: ['/products/laser-wire-markers']
    links:
      type: array
      title: Links
      items:
        type: object
        properties:
          title:
            type: string
          url:
            type: string
